name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Build and test on Linux
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            features: ""
            artifact-suffix: ""
          - name: opencl
            features: "--features opencl"
            artifact-suffix: "-opencl"
            install-deps: "ocl-icd-opencl-dev"

    runs-on: ubuntu-latest
    name: Linux (${{ matrix.name }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        if: matrix.install-deps != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.install-deps }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: linux-${{ matrix.name }}

      - name: Build
        run: cargo build --release ${{ matrix.features }}

      - name: Run tests
        run: cargo test --release ${{ matrix.features }}

      - name: Run clippy
        run: cargo clippy ${{ matrix.features }} -- -D warnings || true

      - name: Check formatting
        run: cargo fmt -- --check || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: btcminer-linux-x64${{ matrix.artifact-suffix }}
          path: target/release/btcminer

  # Build on Windows (with and without OpenCL)
  build-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            features: ""
            artifact-suffix: ""
          - name: opencl
            features: "--features opencl"
            artifact-suffix: "-opencl"

    runs-on: windows-latest
    name: Windows (${{ matrix.name }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OpenCL SDK (for GPU build)
        if: matrix.name == 'opencl'
        run: |
          # Download and install Intel OpenCL SDK
          Invoke-WebRequest -Uri "https://github.com/intel/llvm/releases/download/2024-WW14/win-oclcpuexp-2024.17.3.0.09_rel.zip" -OutFile "opencl-sdk.zip"
          Expand-Archive -Path "opencl-sdk.zip" -DestinationPath "opencl-sdk"
          # Set environment variables for OpenCL
          echo "OPENCL_ROOT=${{ github.workspace }}/opencl-sdk" >> $env:GITHUB_ENV
          echo "${{ github.workspace }}/opencl-sdk" >> $env:GITHUB_PATH

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-${{ matrix.name }}

      - name: Build
        run: cargo build --release ${{ matrix.features }}

      - name: Run tests
        run: cargo test --release ${{ matrix.features }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: btcminer-windows-x64${{ matrix.artifact-suffix }}
          path: target/release/btcminer.exe

  # Build on macOS
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13
            target: x86_64-apple-darwin
            name: macos-x64
          - os: macos-14
            target: aarch64-apple-darwin
            name: macos-arm64

    runs-on: ${{ matrix.os }}
    name: macOS (${{ matrix.name }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Run tests
        run: cargo test --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: btcminer-${{ matrix.name }}
          path: target/${{ matrix.target }}/release/btcminer

  # OpenCL builds for releases (cargo-dist handles standard releases via release.yml)
  # This job creates GPU-enabled variants that complement the cargo-dist releases
  release-opencl:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download OpenCL artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package OpenCL releases
        run: |
          VERSION=${GITHUB_REF#refs/tags/}

          # Function to create archive
          create_archive() {
            local name=$1
            local binary=$2
            local ext=$3

            mkdir -p "package-${name}"
            cp "${binary}" "package-${name}/"
            cp btcminer.example.toml "package-${name}/btcminer.toml.example"
            cp -r web "package-${name}/"
            cp README.md LICENSE "package-${name}/" 2>/dev/null || true

            if [ "$ext" = "zip" ]; then
              cd "package-${name}" && zip -r "../btcminer-${VERSION}-${name}.zip" . && cd ..
            else
              chmod +x "package-${name}/"* 2>/dev/null || true
              cd "package-${name}" && tar -czvf "../btcminer-${VERSION}-${name}.tar.gz" . && cd ..
            fi
          }

          # OpenCL builds only (standard builds handled by cargo-dist)
          create_archive "linux-x64-opencl" "artifacts/btcminer-linux-x64-opencl/btcminer" "tar.gz"
          create_archive "windows-x64-opencl" "artifacts/btcminer-windows-x64-opencl/btcminer.exe" "zip"

      - name: Upload OpenCL releases to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            btcminer-*-opencl.tar.gz
            btcminer-*-opencl.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
