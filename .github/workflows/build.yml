name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Build and test different feature combinations
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            features: ""
            artifact-suffix: ""
          - name: opencl
            features: "--features opencl"
            artifact-suffix: "-opencl"
            install-deps: "ocl-icd-opencl-dev"

    runs-on: ubuntu-latest
    name: Build (${{ matrix.name }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        if: matrix.install-deps != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.install-deps }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Build
        run: cargo build --release ${{ matrix.features }}

      - name: Run tests
        run: cargo test --release ${{ matrix.features }}

      - name: Run clippy
        run: cargo clippy ${{ matrix.features }} -- -D warnings || true

      - name: Check formatting
        run: cargo fmt -- --check || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: btcminer-linux-x64${{ matrix.artifact-suffix }}
          path: target/release/btcminer

  # Release job - builds all variants for tagged releases
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ocl-icd-opencl-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: |
          VERSION=${GITHUB_REF#refs/tags/}

          # Build standard version
          cargo build --release
          mkdir -p release/standard
          cp target/release/btcminer release/standard/

          # Build OpenCL version
          cargo build --release --features opencl
          mkdir -p release/opencl
          cp target/release/btcminer release/opencl/

      - name: Package releases
        run: |
          VERSION=${GITHUB_REF#refs/tags/}

          # Package standard version
          mkdir -p package-standard
          cp release/standard/btcminer package-standard/
          cp btcminer.toml package-standard/btcminer.toml.example
          cp -r web package-standard/
          cp README.md LICENSE package-standard/ 2>/dev/null || true
          cd package-standard
          tar -czvf ../btcminer-${VERSION}-linux-x64.tar.gz .
          cd ..

          # Package OpenCL version
          mkdir -p package-opencl
          cp release/opencl/btcminer package-opencl/
          cp btcminer.toml package-opencl/btcminer.toml.example
          cp -r web package-opencl/
          cp README.md LICENSE package-opencl/ 2>/dev/null || true
          cd package-opencl
          tar -czvf ../btcminer-${VERSION}-linux-x64-opencl.tar.gz .
          cd ..

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: btcminer-*.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
