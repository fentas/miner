name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      - name: Configure
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DNATIVE_BUILD=OFF -DBUILD_TESTS=ON

      - name: Build
        run: |
          cd build
          make -j$(nproc)

      - name: Run tests
        run: |
          cd build
          ./btcminer_test

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: btcminer-linux-x64
          path: build/btcminer

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      - name: Build release binary
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DNATIVE_BUILD=OFF -DBUILD_TESTS=OFF
          make -j$(nproc)
          strip btcminer

      - name: Package
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          mkdir -p release
          cp build/btcminer release/
          cp btcminer.conf.example release/
          cp -r web release/
          cp README.md LICENSE release/ 2>/dev/null || true
          cd release
          tar -czvf ../btcminer-${VERSION}-linux-x64.tar.gz .

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: btcminer-*.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
