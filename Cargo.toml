[package]
name = "btcminer"
version = "0.1.0"
edition = "2021"
authors = ["fentas"]
description = "Bitcoin solo miner with Stratum V1/V2 support"
license = "MIT"
repository = "https://github.com/fentas/miner"
keywords = ["bitcoin", "mining", "stratum", "sv2"]
categories = ["cryptography::cryptocurrencies"]

[features]
default = []
opencl = ["ocl"]
cuda = []  # Future: add cuda-sys or similar
overlay = ["dep:eframe", "dep:egui", "dep:ureq"]

[dependencies]
# Configuration
toml = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
tokio = { version = "1.49", features = ["full"] }
tokio-tungstenite = "0.28"

# Networking
reqwest = { version = "0.13", features = ["json", "stream"] }

# Download engine (HTTP + BitTorrent)
# Using fork with magnet resume fix until PR is merged
# https://github.com/fentas/gosh-dl/commit/adb4d80
gosh-dl = { git = "https://github.com/fentas/gosh-dl.git", branch = "main" }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# CLI
clap = { version = "4.5", features = ["derive"] }

# Crypto & Bitcoin
sha2 = "0.10"
hex = "0.4"
bitcoin = "0.32"

# Web server
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
futures-util = "0.3"

# System info
sysinfo = "0.38"
num_cpus = "1.17"
dirs = "6.0"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Secure random
getrandom = "0.2"

# Constant-time comparison (timing attack prevention)
subtle = "2.6"

# Colored output
colored = "3.1"

# TUI
ratatui = "0.30"
crossterm = "0.29"
chrono = "0.4"

# GPU (optional)
ocl = { version = "0.19", optional = true }
base64 = "0.22.1"

# Overlay (optional) - transparent floating window
eframe = { version = "0.28", optional = true, default-features = false, features = ["glow", "default_fonts"] }
egui = { version = "0.28", optional = true }
ureq = { version = "2.12", optional = true, features = ["json"] }

[dev-dependencies]
tempfile = "3.24"
tokio-test = "0.4"
wiremock = "0.6"
tower = { version = "0.5", features = ["util"] }
criterion = { version = "0.5", features = ["html_reports"] }
ureq = { version = "2.12", features = ["json"] }

[[bench]]
name = "mining_benchmarks"
harness = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin_include)'] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Benchmark profile - match release for accurate measurements
# Without LTO, SHA256 benchmarks can be 100-1000x slower!
[profile.bench]
inherits = "release"
debug = false
lto = "fat"
codegen-units = 1

# Test profile - full optimization for accurate performance tests
[profile.test]
inherits = "release"
debug = false
lto = "fat"
codegen-units = 1

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[lib]
name = "btcminer"
path = "src/lib.rs"

[[bin]]
name = "btcminer"
path = "src/main.rs"

[[bin]]
name = "btcminer-overlay"
path = "src/overlay/main.rs"
required-features = ["overlay"]

# Config for 'dist'
[workspace.metadata.dist]
# CI backends to support
ci = "github"
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
# Extra static files to include in each App (path relative to this Cargo.toml's dir)
include = ["web/", "btcminer.example.toml", "README.md", "LICENSE"]
# The installers to generate for each app
installers = ["shell", "powershell"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.30.3"
# Whether to install an updater program
install-updater = false
