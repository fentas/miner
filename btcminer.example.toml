# BTC Miner Configuration
# Consistent with SRI (Stratum Reference Implementation) TOML format

# ============================================
# POOL CONNECTION
# ============================================

[pool]
# Solo pool preset - ckpool, braiins, ocean, none (true solo), custom
preset = "ckpool"

# Custom pool address (only used when preset = "custom")
# address = "solo.ckpool.org:3333"

# Your Bitcoin address for payouts (REQUIRED)
payout_address = "YOUR_BTC_ADDRESS_HERE"

# Pool password (optional)
password = "x"

# Stratum protocol version - "v1" or "v2"
# Auto-set by preset, or manual override
# stratum_version = "v1"

# ============================================
# MINING
# ============================================

[mining]
# Enable CPU mining
enable_cpu = true

# Number of CPU threads (0 = auto-detect all cores)
threads = 0

# Enable GPU mining (requires CUDA/OpenCL build)
enable_gpu = false

# GPU devices (comma-separated, empty = all)
# gpu_devices = [0, 1, 2]

# GPU intensity (1-100, default 100)
# Higher = more GPU utilization, may affect system responsiveness
# gpu_intensity = 100

# GPU work group size (0 = auto, 64-1024)
# Higher values may improve performance on modern GPUs (RDNA2+)
# gpu_workgroup_size = 0

# GPU batch size exponent (20-28, default 25 = 32M nonces)
# Higher = better GPU utilization but more latency between job updates
# 24 = 16M, 25 = 32M, 26 = 64M, 27 = 128M, 28 = 256M
# gpu_batch_exp = 25

# ============================================
# BITCOIN CORE
# ============================================

[bitcoind]
# Enable Bitcoin Core integration
enabled = false

# Managed mode: auto download, install, configure Bitcoin Core
managed = false

# RPC connection (only when managed = false)
host = "127.0.0.1"
rpc_port = 8332
# rpc_user = "your_username"
# rpc_password = "your_password"

# Data directory (optional, uses default if not set)
# datadir = "/path/to/bitcoin/data"

# Pruned node size in MB (0 = full node, min 550)
prune = 10000

# Database cache size in MB (0 = auto-calculate based on available RAM)
# Higher values significantly speed up initial sync
# Recommended: 4000-8000 if you have 16GB+ RAM
dbcache = 0

# Enable AssumeUTXO for fast initial sync
# Downloads ~9GB UTXO snapshot and syncs in minutes instead of days
# Remaining history is verified in background after node is usable
assumeutxo = false

# Custom magnet URI for AssumeUTXO snapshot (optional)
# Uses torrent for trustless download - verified by infohash
# Default: magnet:?xt=urn:btih:596c26cc709e213fdfec997183ff67067241440c&dn=utxo-840000.dat
# assumeutxo_magnet = "magnet:?xt=urn:btih:..."

# ============================================
# STRATUM V2 (SRI Integration)
# ============================================

[sv2]
# Enable Stratum V2 with Bitcoin Core IPC Mining Interface
enabled = false

# SRI proxy connection
proxy_host = "127.0.0.1"
proxy_port = 34255

# ============================================
# WEB INTERFACE
# ============================================

[web]
# Web interface port (0 to disable)
port = 8080

# Static files directory
dir = "web"

# ============================================
# LOGGING
# ============================================

[logging]
# Stats interval in seconds
stats_interval = 10

# Enable colored output
colors = true

# Log file (empty to disable)
# file = "miner.log"

# Log level: error, warn, info, debug, trace
level = "info"

# System bell on share found
system_bell = true

# Enable TUI dashboard (set to false for continuous log output)
hud = true

# Log output format: "text" or "json"
format = "text"

# ============================================
# NETWORK
# ============================================

[network]
# Reconnection delay (seconds)
reconnect_delay = 5

# Max reconnection delay (exponential backoff limit)
max_reconnect_delay = 300

# ============================================
# IDLE MODE
# ============================================

[idle]
# Enable idle/screensaver mining mode
enabled = false

# Idle timeout in seconds before mining starts
timeout = 900

# Pause mining when user becomes active
pause_on_active = true
